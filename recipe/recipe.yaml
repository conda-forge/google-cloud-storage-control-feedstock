schema_version: 1

context:
  name: google-cloud-storage-control
  version: "1.14.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_storage_control-${{ version }}.tar.gz
  sha256: 9549b617ec63f21bd2e2961c75557883cfdf927858f9519557acb7cec82d5ea0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.25.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - grpcio >=1.59.0,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0
    - grpc-google-iam-v1 >=0.14.1,<1.0.0

tests:
  - python:
      python_version: 
        - ${{ python_min }}.*
        - '*'
      pip_check: true
      imports:
        - google.cloud.storage_control
        - google.cloud.storage_control_v2.services.storage_control.async_client

about:
  summary: Google Cloud Storage Control API client library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-storage-control

extra:
  recipe-maintainers:
    - ankitaluthra1
    - chandra-siri
    - xhochy
